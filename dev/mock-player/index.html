<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sideby mock player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f5f5f7; font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .tag { position: fixed; left: 16px; top: 14px; padding: 6px 10px; border-radius: 999px; background: rgba(28,28,30,.8); color: rgba(235,235,245,.7); font-size: 12px; }
</style>
</head>
<body>
<video id="v" controls playsinline preload="auto" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
<div class="tag">Mock player · stands in for a second Netflix account</div>
</body>
</html>
