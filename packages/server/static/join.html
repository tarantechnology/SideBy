<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sideby</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0b0d; color: #f5f5f7; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  main { max-width: 420px; margin: 18vh auto 0; padding: 0 24px; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { margin: 0 0 8px; color: rgba(235, 235, 245, 0.6); }
  .glyph { position: relative; width: 44px; height: 28px; margin-bottom: 20px; }
  .glyph span { position: absolute; top: 0; width: 28px; height: 28px; border-radius: 50%; }
  .glyph span:first-child { left: 0; background: #f5f5f7; }
  .glyph span:last-child { right: 0; background: rgba(10, 132, 255, 0.16); border: 1.5px solid rgba(10, 132, 255, 0.7); }
</style>
</head>
<body>
<main>
  <div class="glyph" aria-hidden="true"><span></span><span></span></div>
  <h1>Sideby</h1>
  <p>With Sideby installed, this page joins the room and opens the card in the top right.</p>
  <p>Keep this tab, or open a movie on Netflix, Disney+, or Hulu: the room comes with you.</p>
</main>
</body>
</html>
